services:
  db:
    image: postgres:16
    container_name: onboardhub-db
    environment:
      POSTGRES_USER: onboardhub
      POSTGRES_PASSWORD: onboardhub
      POSTGRES_DB: onboardhub
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboardhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgweb:
    image: sosedoff/pgweb:0.17.0
    container_name: onboardhub-pgweb
    environment:
      DATABASE_URL: postgres://onboardhub:onboardhub@db:5432/onboardhub?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
