services:
  db:
    image: postgres:16
    container_name: onboardhub-db
    environment:
      POSTGRES_USER: onboardhub
      POSTGRES_PASSWORD: onboardhub
      POSTGRES_DB: onboardhub
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboardhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
