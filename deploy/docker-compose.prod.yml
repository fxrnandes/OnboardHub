services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: onboardhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: onboardhub
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboardhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${API_IMAGE:-ghcr.io/fxrnandes/onboardhub-api:latest}
    restart: unless-stopped
    environment:
      PORT: 3333
      DATABASE_URL: postgres://onboardhub:${POSTGRES_PASSWORD}@db:5432/onboardhub
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      APP_URL: ${APP_URL:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-ghcr.io/fxrnandes/onboardhub-web:latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?defina API_DOMAIN no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
  caddy-config:
