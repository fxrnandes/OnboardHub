name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend - testes e cobertura
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onboardhub
          POSTGRES_PASSWORD: onboardhub
          POSTGRES_DB: onboardhub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onboardhub"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://onboardhub:onboardhub@localhost:5432/onboardhub
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos
        run: npm run typecheck

      - name: Testes com cobertura (mínimo 75%)
        run: npm run test:coverage

      - name: Build
        run: npm run build
