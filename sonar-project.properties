sonar.organization=fxrnandes
sonar.projectKey=fxrnandes_OnboardHub
sonar.projectName=OnboardHub
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src
sonar.tests=backend/test,frontend/test
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.coverage.exclusions=backend/src/server.ts,backend/src/**/*.cli.ts,frontend/src/main.tsx,frontend/src/**/*.css

sonar.issue.ignore.multicriteria=migrations
sonar.issue.ignore.multicriteria.migrations.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.migrations.resourceKey=backend/src/db/migrate.ts
